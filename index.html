<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stock Trading Platform</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial,
          sans-serif;
        background: #0a0e27;
        color: #e0e6ed;
        padding: 20px;
      }

      .container {
        max-width: 1600px;
        margin: 0 auto;
      }

      h1 {
        text-align: center;
        margin-bottom: 30px;
        color: #00d4ff;
        font-size: 2.5em;
        text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
      }

      .dashboard {
        display: grid;
        grid-template-columns: 1fr 2fr 1fr;
        gap: 20px;
        margin-bottom: 20px;
      }

      .panel {
        background: #1a1f3a;
        border: 1px solid #2a3f5f;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      }

      .panel h2 {
        color: #00d4ff;
        margin-bottom: 15px;
        font-size: 1.3em;
        border-bottom: 2px solid #2a3f5f;
        padding-bottom: 10px;
      }

      .order-form {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      label {
        color: #8b95a5;
        font-size: 0.9em;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      input,
      select {
        background: #0f1729;
        border: 1px solid #2a3f5f;
        color: #e0e6ed;
        padding: 10px;
        border-radius: 6px;
        font-size: 1em;
      }

      input:focus,
      select:focus {
        outline: none;
        border-color: #00d4ff;
        box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
      }

      button {
        background: linear-gradient(135deg, #00d4ff, #0099cc);
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 1em;
        font-weight: 600;
        transition: all 0.3s;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4);
      }

      button.sell {
        background: linear-gradient(135deg, #ff4757, #cc3645);
      }

      .order-book {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
      }

      .bids,
      .asks {
        background: #0f1729;
        border-radius: 8px;
        padding: 15px;
        max-height: 400px;
        overflow-y: auto;
      }

      .bids h3 {
        color: #5cd85a;
        margin-bottom: 10px;
      }

      .asks h3 {
        color: #ff4757;
        margin-bottom: 10px;
      }

      .price-level {
        display: flex;
        justify-content: space-between;
        padding: 8px;
        margin-bottom: 5px;
        border-radius: 4px;
        font-family: "Courier New", monospace;
      }

      .bids .price-level {
        background: rgba(92, 216, 90, 0.1);
        border-left: 3px solid #5cd85a;
      }

      .asks .price-level {
        background: rgba(255, 71, 87, 0.1);
        border-left: 3px solid #ff4757;
      }

      .price {
        font-weight: bold;
        color: #00d4ff;
      }

      .quantity {
        color: #8b95a5;
      }

      .trades-feed {
        max-height: 350px;
        overflow-y: auto;
        background: #0f1729;
        border-radius: 8px;
        padding: 15px;
      }

      .trade-item {
        padding: 10px;
        margin-bottom: 8px;
        border-radius: 6px;
        background: rgba(0, 212, 255, 0.05);
        border-left: 3px solid #00d4ff;
        font-size: 0.9em;
      }

      .trade-item .time {
        color: #8b95a5;
        font-size: 0.85em;
      }

      .trade-item .details {
        margin-top: 5px;
      }

      .portfolio {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      .balance {
        background: linear-gradient(135deg, #667eea, #764ba2);
        padding: 20px;
        border-radius: 8px;
        text-align: center;
      }

      .balance-amount {
        font-size: 2em;
        font-weight: bold;
        color: white;
      }

      .holdings {
        background: #0f1729;
        border-radius: 8px;
        padding: 15px;
        max-height: 300px;
        overflow-y: auto;
      }

      .holding-item {
        display: flex;
        justify-content: space-between;
        padding: 12px;
        margin-bottom: 8px;
        border-radius: 6px;
        background: rgba(0, 212, 255, 0.05);
      }

      .holding-stock {
        font-weight: bold;
        color: #00d4ff;
      }

      .holding-qty {
        color: #8b95a5;
      }

      .holding-pl {
        font-weight: bold;
      }

      .holding-pl.positive {
        color: #5cd85a;
      }

      .holding-pl.negative {
        color: #ff4757;
      }

      .stock-selector {
        display: flex;
        gap: 10px;
        margin-bottom: 15px;
      }

      .stock-btn {
        flex: 1;
        padding: 10px;
        background: #0f1729;
        border: 2px solid #2a3f5f;
        border-radius: 6px;
        color: #8b95a5;
        cursor: pointer;
        transition: all 0.3s;
      }

      .stock-btn.active {
        border-color: #00d4ff;
        color: #00d4ff;
        background: rgba(0, 212, 255, 0.1);
      }

      .status {
        padding: 10px;
        border-radius: 6px;
        margin-bottom: 15px;
        text-align: center;
        font-weight: 600;
      }

      .status.success {
        background: rgba(92, 216, 90, 0.2);
        color: #5cd85a;
        border: 1px solid #5cd85a;
      }

      .status.error {
        background: rgba(255, 71, 87, 0.2);
        color: #ff4757;
        border: 1px solid #ff4757;
      }

      ::-webkit-scrollbar {
        width: 8px;
      }

      ::-webkit-scrollbar-track {
        background: #0f1729;
        border-radius: 4px;
      }

      ::-webkit-scrollbar-thumb {
        background: #2a3f5f;
        border-radius: 4px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #3a4f6f;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>📈 Real-Time Stock Trading Platform</h1>

      <div class="dashboard">
        <!-- Left Panel: Order Placement -->
        <div class="panel">
          <h2>Place Order</h2>

          <div id="status"></div>

          <form class="order-form" id="orderForm">
            <div class="form-group">
              <label>Stock Symbol</label>
              <select id="stockSymbol" required>
                <option value="AAPL">AAPL - Apple</option>
                <option value="GOOGL">GOOGL - Google</option>
                <option value="MSFT">MSFT - Microsoft</option>
                <option value="TSLA">TSLA - Tesla</option>
                <option value="AMZN">AMZN - Amazon</option>
              </select>
            </div>

            <div class="form-group">
              <label>Order Type</label>
              <select id="orderType" required>
                <option value="BUY">Buy</option>
                <option value="SELL">Sell</option>
              </select>
            </div>

            <div class="form-group">
              <label>Price ($)</label>
              <input
                type="number"
                id="price"
                step="0.01"
                min="0.01"
                value="150.00"
                required
              />
            </div>

            <div class="form-group">
              <label>Quantity</label>
              <input type="number" id="quantity" min="1" value="10" required />
            </div>

            <button type="submit">Place Order</button>
          </form>

          <div style="margin-top: 20px">
            <h2>Quick Fill</h2>
            <p style="color: #8b95a5; font-size: 0.9em; margin-bottom: 10px">
              Generate random orders for testing
            </p>
            <button onclick="autoGenerateOrders(10)">Generate 10 Orders</button>
          </div>
        </div>

        <!-- Middle Panel: Order Book -->
        <div class="panel">
          <h2>Order Book</h2>

          <div class="stock-selector">
            <div
              class="stock-btn active"
              data-stock="AAPL"
              onclick="selectStock('AAPL')"
            >
              AAPL
            </div>
            <div
              class="stock-btn"
              data-stock="GOOGL"
              onclick="selectStock('GOOGL')"
            >
              GOOGL
            </div>
            <div
              class="stock-btn"
              data-stock="MSFT"
              onclick="selectStock('MSFT')"
            >
              MSFT
            </div>
            <div
              class="stock-btn"
              data-stock="TSLA"
              onclick="selectStock('TSLA')"
            >
              TSLA
            </div>
            <div
              class="stock-btn"
              data-stock="AMZN"
              onclick="selectStock('AMZN')"
            >
              AMZN
            </div>
          </div>

          <div class="order-book">
            <div class="bids">
              <h3>📈 Bids (Buy Orders)</h3>
              <div id="bidsList"></div>
            </div>
            <div class="asks">
              <h3>📉 Asks (Sell Orders)</h3>
              <div id="asksList"></div>
            </div>
          </div>

          <div style="margin-top: 20px">
            <h2>Recent Trades</h2>
            <div class="trades-feed" id="tradesFeed"></div>
          </div>
        </div>

        <!-- Right Panel: Portfolio -->
        <div class="panel">
          <h2>My Portfolio</h2>

          <div class="portfolio">
            <div class="balance">
              <div style="color: rgba(255, 255, 255, 0.8); margin-bottom: 5px">
                Account Balance
              </div>
              <div class="balance-amount" id="balance">$10,000.00</div>
            </div>

            <div>
              <h3 style="margin-bottom: 10px; color: #00d4ff">Holdings</h3>
              <div class="holdings" id="holdingsList">
                <div style="text-align: center; color: #8b95a5; padding: 20px">
                  No holdings yet
                </div>
              </div>
            </div>

            <div style="text-align: center">
              <button onclick="loadPortfolio()">Refresh Portfolio</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const API_URL = "http://localhost:8080/api";
      const USER_ID = 1; // Default user for demo
      let currentStock = "AAPL";
      let ws = null;

      // Initialize WebSocket connection
      function initWebSocket() {
        ws = new WebSocket("ws://localhost:8080/ws/trades");

        ws.onmessage = (event) => {
          const trade = JSON.parse(event.data);
          addTradeToFeed(trade);

          // Refresh order book if trade is for current stock
          if (trade.stock === currentStock) {
            loadOrderBook(currentStock);
          }
        };

        ws.onerror = (error) => {
          console.error("WebSocket error:", error);
        };

        ws.onclose = () => {
          console.log("WebSocket closed. Reconnecting in 3s...");
          setTimeout(initWebSocket, 3000);
        };
      }

      // Place order
      document
        .getElementById("orderForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const order = {
            user_id: USER_ID,
            stock: document.getElementById("stockSymbol").value,
            type: document.getElementById("orderType").value,
            price: parseFloat(document.getElementById("price").value),
            quantity: parseInt(document.getElementById("quantity").value),
          };

          try {
            const response = await fetch(`${API_URL}/order/place`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(order),
            });

            const result = await response.json();

            if (response.ok) {
              showStatus("Order placed successfully!", "success");

              if (result.trades && result.trades.length > 0) {
                showStatus(
                  `Order matched! Executed ${result.trades.length} trade(s)`,
                  "success"
                );
              } else if (result.remaining > 0) {
                showStatus(
                  `Order placed. ${result.remaining} shares pending`,
                  "success"
                );
              }

              loadOrderBook(order.stock);
              loadPortfolio();
            } else {
              showStatus(`Error: ${result.error || "Unknown error"}`, "error");
            }
          } catch (error) {
            showStatus("Failed to place order: " + error.message, "error");
          }
        });

      // Show status message
      function showStatus(message, type) {
        const statusDiv = document.getElementById("status");
        statusDiv.className = `status ${type}`;
        statusDiv.textContent = message;

        setTimeout(() => {
          statusDiv.className = "";
          statusDiv.textContent = "";
        }, 3000);
      }

      // Load order book
      async function loadOrderBook(stock) {
        try {
          const response = await fetch(`${API_URL}/orderbook/${stock}`);
          const data = await response.json();

          // Display bids
          const bidsList = document.getElementById("bidsList");
          bidsList.innerHTML = "";

          if (data.bids && data.bids.length > 0) {
            data.bids.slice(0, 10).forEach((bid) => {
              bidsList.innerHTML += `
                            <div class="price-level">
                                <span class="price">$${bid.price.toFixed(
                                  2
                                )}</span>
                                <span class="quantity">${
                                  bid.quantity
                                } shares</span>
                            </div>
                        `;
            });
          } else {
            bidsList.innerHTML =
              '<div style="text-align: center; color: #8b95a5; padding: 20px;">No bids</div>';
          }

          // Display asks
          const asksList = document.getElementById("asksList");
          asksList.innerHTML = "";

          if (data.asks && data.asks.length > 0) {
            data.asks.slice(0, 10).forEach((ask) => {
              asksList.innerHTML += `
                            <div class="price-level">
                                <span class="price">$${ask.price.toFixed(
                                  2
                                )}</span>
                                <span class="quantity">${
                                  ask.quantity
                                } shares</span>
                            </div>
                        `;
            });
          } else {
            asksList.innerHTML =
              '<div style="text-align: center; color: #8b95a5; padding: 20px;">No asks</div>';
          }
        } catch (error) {
          console.error("Failed to load order book:", error);
        }
      }

      // Load portfolio
      async function loadPortfolio() {
        try {
          const response = await fetch(`${API_URL}/portfolio/${USER_ID}`);
          const data = await response.json();

          // Update balance
          document.getElementById(
            "balance"
          ).textContent = `$${data.balance.toFixed(2)}`;

          // Update holdings
          const holdingsList = document.getElementById("holdingsList");
          holdingsList.innerHTML = "";

          if (data.holdings && data.holdings.length > 0) {
            data.holdings.forEach((holding) => {
              const pl = holding.profit_loss;
              const plClass = pl >= 0 ? "positive" : "negative";
              const plSign = pl >= 0 ? "+" : "";

              holdingsList.innerHTML += `
                            <div class="holding-item">
                                <div>
                                    <div class="holding-stock">${
                                      holding.stock
                                    }</div>
                                    <div class="holding-qty">${
                                      holding.quantity
                                    } shares @ $${holding.avg_buy_price.toFixed(
                2
              )}</div>
                                </div>
                                <div class="holding-pl ${plClass}">
                                    ${plSign}$${pl.toFixed(2)}
                                </div>
                            </div>
                        `;
            });
          } else {
            holdingsList.innerHTML =
              '<div style="text-align: center; color: #8b95a5; padding: 20px;">No holdings yet</div>';
          }
        } catch (error) {
          console.error("Failed to load portfolio:", error);
        }
      }

      // Add trade to feed
      function addTradeToFeed(trade) {
        const feed = document.getElementById("tradesFeed");
        const time = new Date(trade.executed_at).toLocaleTimeString();

        const tradeItem = document.createElement("div");
        tradeItem.className = "trade-item";
        tradeItem.innerHTML = `
                <div class="time">${time}</div>
                <div class="details">
                    <strong>${trade.stock}</strong>: ${
          trade.quantity
        } shares @ $${trade.price.toFixed(2)}
                </div>
            `;

        feed.insertBefore(tradeItem, feed.firstChild);

        // Keep only last 20 trades
        while (feed.children.length > 20) {
          feed.removeChild(feed.lastChild);
        }
      }

      // Select stock
      function selectStock(stock) {
        currentStock = stock;

        // Update active button
        document.querySelectorAll(".stock-btn").forEach((btn) => {
          btn.classList.remove("active");
        });
        document
          .querySelector(`[data-stock="${stock}"]`)
          .classList.add("active");

        // Update stock selector in form
        document.getElementById("stockSymbol").value = stock;

        // Load order book for selected stock
        loadOrderBook(stock);
      }

      // Auto-generate random orders for testing
      async function autoGenerateOrders(count) {
        const stocks = ["AAPL", "GOOGL", "MSFT", "TSLA", "AMZN"];
        const types = ["BUY", "SELL"];

        for (let i = 0; i < count; i++) {
          const order = {
            user_id: Math.floor(Math.random() * 10) + 1,
            stock: stocks[Math.floor(Math.random() * stocks.length)],
            type: types[Math.floor(Math.random() * types.length)],
            price: 145 + Math.random() * 20,
            quantity: Math.floor(Math.random() * 50) + 10,
          };

          try {
            await fetch(`${API_URL}/order/place`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(order),
            });

            await new Promise((resolve) => setTimeout(resolve, 100)); // 100ms delay
          } catch (error) {
            console.error("Failed to generate order:", error);
          }
        }

        showStatus(`Generated ${count} random orders`, "success");
        loadOrderBook(currentStock);
      }

      // Initialize
      initWebSocket();
      loadOrderBook(currentStock);
      loadPortfolio();

      // Auto-refresh every 2 seconds
      setInterval(() => {
        loadOrderBook(currentStock);
      }, 2000);

      setInterval(() => {
        loadPortfolio();
      }, 5000);
    </script>
  </body>
</html>
